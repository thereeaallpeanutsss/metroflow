    <script>
      (function() {
        // Fix for GitHub Pages: ensure trailing slash so relative paths resolve to the repo subpath
        if (
          window.location.pathname &&
          !window.location.pathname.endsWith('/') &&
          !window.location.pathname.split('/').pop().includes('.')
        ) {
          window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
          return;
        }

        

        try {
          var saved = localStorage.getItem('metroflow_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}

        // Suppress Vite HMR WebSocket connection warnings in sandboxed iframe preview
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('WebSocket') !== -1)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        console.error = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('WebSocket') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
