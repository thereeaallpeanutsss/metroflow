<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Fix for GitHub Pages: ensure trailing slash so relative paths resolve to the repo subpath
        if (
          window.location.pathname &&
          !window.location.pathname.endsWith('/') &&
          !window.location.pathname.split('/').pop().includes('.')
        ) {
          window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
          return;
        }

        // If GitHub Pages is deployed from root (/), automatically redirect to the compiled /docs/ bundle
        if (
          window.location.hostname.includes('github.io') &&
          !window.location.pathname.includes('/docs')
        ) {
          var basePath = window.location.pathname.replace(/\/+$/, '');
          window.location.replace(basePath + '/docs/' + window.location.search + window.location.hash);
          return;
        }

        try {
          var saved = localStorage.getItem('metroflow_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}

        // Suppress Vite HMR WebSocket connection warnings & unhandled rejections in sandboxed iframe preview
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            (reason && reason.stack && reason.stack.indexOf('@vite/client') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return;
          }
        });

        window.addEventListener('error', function(event) {
          var msg = (event.message || (event.error && event.error.message) || '') + '';
          var src = (event.filename || '') + '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            src.indexOf('@vite/client') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return;
          }
        });

        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('WebSocket') !== -1)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        console.error = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('WebSocket') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
